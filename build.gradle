plugins {
    id 'architectury-plugin' version '3.5.166'
    id 'dev.architectury.loom' version '1.14.473' apply false
    id 'com.gradleup.shadow' version '9.4.1' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }
        maven {
            name = 'Architectury'
            url = uri('https://maven.architectury.dev/')
        }
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases/')
        }
        maven {
            name = 'ParchmentMC'
            url = uri('https://maven.parchmentmc.org')
        }
        maven {
            name = 'Terraformers'
            url = uri('https://maven.terraformersmc.com/releases/')
        }
        maven {
            name = 'Xander Maven'
            url = uri('https://maven.isxander.dev/releases')
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_mappings_version}@zip")
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
}
