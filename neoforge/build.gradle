plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_neoforge_version}"
    forgeRuntimeLibrary "org.quiltmc.parsers:json:${rootProject.quilt_parsers_version}"
    forgeRuntimeLibrary "org.quiltmc.parsers:gson:${rootProject.quilt_parsers_version}"
    forgeRuntimeLibrary "org.jetbrains:annotations:24.0.1"
    include(implementation("org.quiltmc.parsers:json:${rootProject.quilt_parsers_version}"))
    include(implementation("org.quiltmc.parsers:gson:${rootProject.quilt_parsers_version}"))

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    def replaceProperties = [
            minecraft_version      : rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version            : rootProject.neo_version,
            loader_version_range   : rootProject.loader_version_range,
            yacl_version           : rootProject.yacl_neoforge_version,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_license            : rootProject.mod_license,
            mod_version            : project.version,
            mod_description        : rootProject.mod_description,
            mod_authors            : rootProject.mod_authors,
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.shadowCommon]
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        register('mavenNeoForge', MavenPublication) {
            artifactId = project.base.archivesName.get()
            from components.java
        }
    }
}
